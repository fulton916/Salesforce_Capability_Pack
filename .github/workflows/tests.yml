name: Tests

# Offline tests only: no secrets, no Salesforce org, no sf CLI.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  python:
    name: Python packages (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: sf-*/requirements.txt
      - name: Install dependencies
        shell: bash
        run: |
          args=()
          for f in sf-*/requirements.txt; do args+=(-r "$f"); done
          python -m pip install "${args[@]}" openpyxl
      - name: Run tests
        shell: bash
        run: |
          # sf-translation-field-notes is docs only (no tests), so it is left out.
          packages="sf-country-state-codes sf-safe-translation-push sf-territory-export
          sf-translation-defect-repair sf-translation-deploy-triage sf-translation-reconcile
          sf-translation-toolkit sf-user-access-teardown"
          failed=""
          for d in $packages; do
            echo "::group::$d"
            (cd "$d" && python tests/run_tests.py) || failed="$failed $d"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "FAILED packages:$failed"
            exit 1
          fi
          echo "All packages passed."

  node:
    name: chrome-extension (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run tests
        working-directory: chrome-extension
        run: node tests/run_tests.mjs
