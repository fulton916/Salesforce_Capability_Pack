<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Salesforce Capability Pack</title>
<link rel="stylesheet" href="shared/pack.css">
<style>
  body { width: 320px; padding: 14px; }
  .host { font: 12px/1.4 var(--mono); color: var(--muted); word-break: break-all; margin: 6px 0 12px; }
  #menu { display: flex; flex-direction: column; gap: 8px; }
  #menu button { width: 100%; text-align: left; padding: 8px 10px; }
  #menu .tool-title { display: block; font-weight: 600; }
  #menu .tool-desc { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .footer { margin-top: 14px; text-align: left; font-size: 12px; color: var(--muted); }
  .footer a { color: var(--accent, #0b5cab); text-decoration: none; }
  .footer a:hover, .footer a:focus-visible { text-decoration: underline; }
</style>
</head>
<body>
  <h1 class="popup-title">Salesforce Capability Pack</h1>
  <div id="state">Looking for a Salesforce tab…</div>
  <div class="host" id="host"></div>
  <div id="menu"></div>
  <div class="footer">
    <a id="report-bug" href="#">Report a bug</a>
    <span aria-hidden="true">·</span>
    <a id="suggest" href="#">Suggest an improvement</a>
    <span aria-hidden="true">·</span>
    <a id="settings" href="settings.html">Settings</a>
    <span aria-hidden="true">·</span>
    <span id="version"></span>
  </div>
  <script type="module" src="menu.js"></script>
</body>
</html>
