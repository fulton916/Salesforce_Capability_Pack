<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings - Salesforce Capability Pack</title>
<link rel="stylesheet" href="shared/pack.css">
<style>
  main { max-width: 640px; }
  #tools { list-style: none; margin: 16px 0; padding: 0; }
  #tools li { border-top: 1px solid var(--line); }
  #tools li:last-child { border-bottom: 1px solid var(--line); }
  #tools label { display: flex; gap: 12px; align-items: flex-start; padding: 12px 4px; cursor: pointer; }
  #tools input { width: 20px; height: 20px; margin: 2px 0 0; flex: none; cursor: pointer; }
  #tools .tool-title { display: block; font-weight: 600; }
  #tools .tool-desc { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
  .row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; min-height: 2.4em; }
  #status { font-size: 14px; color: var(--good); }
  #status.bad { color: var(--risk); }
  #notkept { color: var(--b); font-size: 14px; margin: 8px 0; }
</style>
</head>
<body>
  <main>
    <h1>Settings</h1>
    <p class="hint">Choose which tools show in the toolbar menu.</p>
    <p id="notkept" hidden>This page is not running inside the extension, so your changes are not kept.</p>
    <ul id="tools"></ul>
    <div class="row">
      <button type="button" id="show-all">Show all tools</button>
      <span id="status" role="status" aria-live="polite"></span>
    </div>
    <p class="hint">Hiding a tool only removes it from the menu. It changes nothing in Salesforce and does not stop anyone from opening the tool.</p>
  </main>
  <script type="module" src="settings.js"></script>
</body>
</html>
