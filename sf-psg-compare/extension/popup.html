<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Salesforce Capability Pack</title>
<link rel="stylesheet" href="psg-compare.css">
<style>
  body { width: 320px; padding: 14px; }
  .host { font: 12px/1.4 var(--mono); color: var(--muted); word-break: break-all; margin: 6px 0 12px; }
  #menu { display: flex; flex-direction: column; gap: 8px; }
  #menu button { width: 100%; text-align: left; padding: 8px 10px; }
  #menu .tool-title { display: block; font-weight: 600; }
  #menu .tool-desc { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .feedback { margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  .feedback .row { display: flex; gap: 8px; margin-top: 6px; }
  .feedback button { padding: 3px 10px; font-size: 12px; }
</style>
</head>
<body>
  <h1 class="popup-title">Salesforce Capability Pack</h1>
  <div id="state">Looking for a Salesforce tab…</div>
  <div class="host" id="host"></div>
  <div id="menu"></div>
  <div class="feedback">
    Found a problem or have an idea?
    <div class="row">
      <button type="button" id="report-bug">Report a bug</button>
      <button type="button" id="suggest">Suggest an improvement</button>
    </div>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
